name: Lean scope proofs

# Plan step 7 (docs/superpowers/plans/2026-11-09-lean-scope.md): the model, the proofs
# and the differential tests stay in step with the Python they are about.
on:
  pull_request:
    paths: ["src/orbit_audit/**", "lean/**", "tests/lean/**", "tests/structural/**",
            "uv.lock", "pyproject.toml",
            ".github/workflows/lean.yml"]
  push:
    branches: [main]
    paths: ["src/orbit_audit/**", "lean/**", "tests/lean/**", "tests/structural/**",
            "uv.lock", "pyproject.toml",
            ".github/workflows/lean.yml"]
  schedule:
    - cron: "43 2 * * *"  # nightly: the long Hypothesis profile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DOTENV_DISABLED: "1"
  ORBIT_AUTOFETCH: "0"
  ORBIT_AUTOSTART_SERVICE: "0"
  UV_NO_ENV_FILE: "1"

jobs:
  lean:
    name: Proofs and differential tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: lean
          build-args: "--wfail"
          leanchecker: true
      - name: Proof gate (spec hash, forbidden constructs, axiom allow-list)
        working-directory: lean
        run: LEAN="$(command -v lean)" ./check.sh
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked
      - name: Structural and differential tests
        env:
          LEAN_REQUIRED: "1"
          HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'lean-nightly' || 'lean-pr' }}
        run: LEAN="$(command -v lean)" uv run --locked pytest -q --tb=short tests/structural tests/lean
