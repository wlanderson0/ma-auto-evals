name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DOTENV_DISABLED: "1"
  ORBIT_AUTOFETCH: "0"
  ORBIT_AUTOSTART_SERVICE: "0"
  UV_NO_ENV_FILE: "1"

jobs:
  tests:
    name: Offline tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check src tests experiments
      - name: Run offline tests
        run: uv run --locked pytest -q --tb=short --durations=10
